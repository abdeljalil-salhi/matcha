repos:
  - repo: local
    hooks:
      - id: black
        name: Black
        entry: black
        language: python
        language_version: python3.12
        additional_dependencies: [black==26.10.1]
        types: [python]
      - id: flake8
        name: Flake8
        entry: flake8
        language: python
        language_version: python3.12
        additional_dependencies: [flake8==7.5.0]
        types: [python]
