x-backend: &backend
  build:
    context: .
    dockerfile: server/Dockerfile
  env_file: ${MATCHA_ENV_FILE:-.env}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17
    env_file: ${MATCHA_ENV_FILE:-.env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
  setup:
    <<: *backend
    command: ["python", "-m", "server.manage", "migrate"]
  api:
    <<: *backend
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
  worker:
    <<: *backend
    command: ["python", "-m", "server.manage", "mail"]
    depends_on:
      setup:
        condition: service_completed_successfully
      mail:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres:
