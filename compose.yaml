x-backend: &backend
  build:
    context: .
    dockerfile: server/Dockerfile
    target: runtime
  env_file: ${MATCHA_ENV_FILE:-.env}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17
    env_file: ${MATCHA_ENV_FILE:-.env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_BIND_HOST:-127.0.0.1}:${MAILPIT_PORT:-8025}:8025"
  setup:
    <<: *backend
    command: ["python", "-m", "server.manage", "migrate"]
  api:
    <<: *backend
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_URL: /api
      API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/frontend/src:ro
      - ./frontend/public:/app/frontend/public:ro
      - ./frontend/index.html:/app/frontend/index.html:ro
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts:ro
      - ./data/places.json:/app/data/places.json:ro
      - ${TLS_CERTS_DIR:-./infra/certs}:/app/infra/certs:ro
    healthcheck:
      # Vite serves HTTPS when TLS_CERT_FILE/TLS_KEY_FILE are set (.env.lan),
      # plain HTTP otherwise (.env). The dev cert is self-signed, so skip
      # verification for this loopback probe only.
      test:
        - CMD-SHELL
        - >-
          NODE_TLS_REJECT_UNAUTHORIZED=0 node --no-warnings -e
          "const proto = process.env.TLS_CERT_FILE && process.env.TLS_KEY_FILE ? 'https' : 'http';
          fetch(proto + '://127.0.0.1:5173/api/health')
            .then(r => { if (!r.ok) process.exit(1); })
            .catch(() => process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
  worker:
    <<: *backend
    command: ["python", "-m", "server.manage", "mail"]
    depends_on:
      setup:
        condition: service_completed_successfully
      mail:
        condition: service_started
    restart: unless-stopped

  test-db:
    image: postgres:17
    profiles: [tools]
    environment:
      POSTGRES_DB: matcha_test
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matcha_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  tools:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: development
    profiles: [tools]
    user: "${MATCHA_UID:-1000}:${MATCHA_GID:-1000}"
    working_dir: /app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - .:/app
  smoke-tools:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: docker_tools
    profiles: [tools]
    user: "0:0"
    working_dir: ${MATCHA_WORKSPACE:-/workspace}
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      MATCHA_SMOKE_IN_DOCKER: "1"
    volumes:
      - ${MATCHA_WORKSPACE:-.}:${MATCHA_WORKSPACE:-/workspace}
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres:
